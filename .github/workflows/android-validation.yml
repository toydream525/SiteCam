name: Android validation
on:
  push:
    branches: [codex/readable-snapshot-burst]
  pull_request:
    paths: ['app/**', 'gradle/**', '*.gradle.kts', '.github/workflows/android-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
